<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login — Elea</title>
  <link rel="icon" href="assets/best.png" type="image/png" />
  <link rel="apple-touch-icon" href="assets/best.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="auth-page auth-page--green-gold">
  <div class="auth-top-bar">
    <div class="lang-switch" aria-label="Language switcher">
      <button type="button" class="lang-toggle-btn" data-lang-toggle="en">EN</button>
      <span>|</span>
      <button type="button" class="lang-toggle-btn active" data-lang-toggle="de">DE</button>
    </div>
    <button type="button" class="auth-close-btn" data-close-form aria-label="Close login form">
      <span aria-hidden="true">&times;</span>
    </button>
  </div>

  <main class="auth-shell">
    <div class="auth-card auth-card--green-gold">
      <div class="auth-card-header">
        <div class="auth-icon-wrap" aria-hidden="true">E</div>
        <h1 class="auth-title" data-i18n="auth.login.title">Willkommen zurück</h1>
        <p class="auth-subtitle" data-i18n="auth.login.subtitle">Melden Sie sich bei Ihrem Konto an</p>
      </div>
      <form id="login-form" class="auth-form">
        <div class="auth-field">
          <label class="auth-label" data-i18n="auth.login.email">E-Mail</label>
          <input id="login-email" class="auth-input" type="email" data-i18n-placeholder="auth.login.email" placeholder="E-Mail" required />
        </div>
        <div class="auth-field">
          <label class="auth-label" data-i18n="auth.login.password">Passwort</label>
          <input id="login-password" class="auth-input" type="password" data-i18n-placeholder="auth.login.password" placeholder="Passwort" required />
        </div>
        <div class="auth-field">
          <label class="auth-label" data-i18n="auth.login.code">Bestätigungscode</label>
          <input id="login-code" class="auth-input" type="text" inputmode="numeric" maxlength="7" data-i18n-placeholder="auth.login.codePlaceholder" placeholder="6-stelliger Code" required />
        </div>
        <div class="auth-row auth-row--stacked">
          <button type="submit" class="elea-button-primary auth-submit" data-i18n-value="auth.login.submitLabel">Anmelden</button>
        </div>
        <div class="auth-divider"><span data-i18n="auth.login.or">oder</span></div>
        <div class="auth-footer">
          <span data-i18n="auth.login.footer">Sie haben noch kein Konto?</span>
          <a href="signup.html" data-i18n-html="auth.login.create">Erstellen Sie eines</a>
        </div>
        <div id="login-message" class="auth-error" aria-live="polite"></div>
      </form>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
