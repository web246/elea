<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin — Elea</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <style>
    :root {
      --luxury-forest: #0d2d27;
      --luxury-forest-2: #113d34;
      --luxury-gold: #d8b36a;
      --luxury-gold-soft: #f0d8a9;
      --luxury-panel: rgba(12, 28, 25, 0.82);
      --luxury-panel-alt: rgba(21, 38, 34, 0.62);
      --luxury-border: rgba(216, 179, 106, 0.22);
      --luxury-text: #f5efe5;
      --luxury-muted: rgba(245, 239, 229, 0.7);
      --luxury-surface: rgba(255, 255, 255, 0.04);
      --luxury-error: #f8b4b4;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
      background: radial-gradient(circle at top, rgba(216, 179, 106, 0.12), transparent 20%), linear-gradient(160deg, #0a1e1b 0%, #0d2d27 30%, #102d2a 100%);
      color: var(--luxury-text);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      line-height: 1.5;
      letter-spacing: 0.01em;
    }

    button, input, textarea, select {
      font: inherit;
    }

    .admin-shell {
      width: min(1440px, calc(100% - 2rem));
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      gap: 1.4rem;
      padding: 1.2rem 0 2.5rem;
    }

    .admin-sidebar {
      width: 280px;
      background: rgba(8, 15, 13, 0.72);
      border: 1px solid var(--luxury-border);
      border-radius: 24px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.25);
      padding: 1.5rem 1rem;
      display: flex;
      flex-direction: column;
      backdrop-filter: blur(18px);
    }

    .sidebar-brand {
      padding: 0.4rem 0.65rem 1rem;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      margin-bottom: 1rem;
    }

    .brand-mark {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 1.8rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--luxury-gold-soft);
    }

    .brand-mark::before {
      content: "";
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f7df9b, #b98a3f);
      box-shadow: 0 0 18px rgba(216, 179, 106, 0.9);
    }

    .sidebar-brand small {
      display: block;
      margin-top: 0.45rem;
      color: rgba(255,255,255,0.5);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      font-size: 0.63rem;
      padding-left: 1.8rem;
    }

    .admin-nav {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      margin-top: 0.5rem;
    }

    .admin-tab {
      width: 100%;
      border: 1px solid transparent;
      background: rgba(255,255,255,0.02);
      color: var(--luxury-text);
      border-radius: 14px;
      padding: 0.82rem 0.9rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: left;
    }

    .admin-tab:hover,
    .admin-tab.active {
      background: linear-gradient(135deg, rgba(216,179,106,0.15), rgba(255,255,255,0.04));
      border-color: rgba(216,179,106,0.28);
      transform: translateX(2px);
    }

    .admin-tab.active {
      box-shadow: inset 0 0 0 1px rgba(216,179,106,0.2);
    }

    .tab-badge {
      min-width: 1.45rem;
      height: 1.45rem;
      padding: 0 0.4rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      background: linear-gradient(135deg, #f1dca2, #c5974f);
      color: #1e1a13;
      font-size: 0.64rem;
      font-weight: 700;
    }

    .admin-user {
      margin-top: auto;
      padding-top: 1rem;
      border-top: 1px solid rgba(255,255,255,0.08);
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .admin-user-email {
      color: rgba(255,255,255,0.72);
      font-size: 0.76rem;
      word-break: break-all;
      padding: 0 0.2rem;
    }

    .admin-logout,
    .admin-mobile-logout,
    .action-btn,
    .asset-btn,
    .elea-button-primary,
    .elea-button-outline {
      border-radius: 12px;
      border: 1px solid rgba(216,179,106,0.28);
      cursor: pointer;
      transition: transform 0.2s ease, filter 0.2s ease, background 0.2s ease;
    }

    .admin-logout,
    .admin-mobile-logout {
      background: transparent;
      color: var(--luxury-text);
      padding: 0.7rem 0.9rem;
      border: 1px solid rgba(255,255,255,0.12);
    }

    .admin-logout:hover,
    .admin-mobile-logout:hover,
    .action-btn:hover,
    .asset-btn:hover,
    .elea-button-primary:hover,
    .elea-button-outline:hover {
      transform: translateY(-1px);
      filter: brightness(1.04);
    }

    .admin-main {
      flex: 1;
      min-width: 0;
      border-radius: 28px;
      background: rgba(10, 20, 18, 0.72);
      border: 1px solid var(--luxury-border);
      box-shadow: 0 25px 60px rgba(0,0,0,0.28);
      padding: 1.4rem 1.2rem 1.8rem;
      backdrop-filter: blur(18px);
    }

    .admin-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.2rem;
      padding: 0.2rem 0.2rem 0.85rem;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .admin-header h1 {
      margin: 0.15rem 0 0;
      font-size: clamp(2rem, 3vw, 3rem);
      line-height: 1.1;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--luxury-gold-soft);
    }

    .admin-kicker {
      margin: 0;
      color: rgba(255,255,255,0.6);
      text-transform: uppercase;
      letter-spacing: 0.2em;
      font-size: 0.62rem;
    }

    .admin-mobile-logout {
      display: none;
    }

    .admin-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
      justify-content: space-between;
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 18px;
      padding: 0.9rem 1rem;
      margin-bottom: 1rem;
    }

    .admin-search {
      position: relative;
      flex: 1 1 280px;
      min-width: 0;
    }

    .admin-search svg {
      position: absolute;
      left: 0.9rem;
      top: 50%;
      transform: translateY(-50%);
      width: 1rem;
      height: 1rem;
      color: rgba(255,255,255,0.6);
    }

    .admin-search input {
      width: 100%;
      min-height: 3rem;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      color: var(--luxury-text);
      padding: 0.8rem 1rem 0.8rem 2.6rem;
    }

    .admin-search input::placeholder {
      color: rgba(255,255,255,0.5);
    }

    .admin-filter {
      display: inline-flex;
      align-items: center;
      gap: 0.7rem;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.03);
      border-radius: 12px;
      padding: 0.5rem 0.8rem;
      color: rgba(255,255,255,0.7);
      min-height: 3rem;
    }

    .admin-filter .pill {
      background: rgba(216,179,106,0.14);
      border: 1px solid rgba(216,179,106,0.2);
      color: var(--luxury-text);
      padding: 0.45rem 0.8rem;
      border-radius: 999px;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .admin-section {
      display: block;
    }

    .admin-grid,
    .admin-bookings-grid,
    .admin-review-grid,
    .admin-assets-grid,
    .admin-cta-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1rem;
    }

    .admin-card,
    .admin-booking-card,
    .admin-review-card,
    .asset-card,
    .promo-admin-card,
    .admin-stat-card,
    .admin-note {
      background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02));
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 18px;
      box-shadow: 0 14px 30px rgba(0,0,0,0.1);
    }

    .admin-stat-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.9rem;
      margin-bottom: 1rem;
      grid-column: 1 / -1;
    }

    .admin-stat-card {
      padding: 0.9rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .admin-stat-card span {
      color: rgba(255,255,255,0.62);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-size: 0.62rem;
    }

    .admin-stat-card strong {
      font-size: clamp(1.8rem, 3vw, 2.6rem);
      color: var(--luxury-gold-soft);
      font-weight: 700;
    }

    .admin-card,
    .admin-booking-card,
    .admin-review-card,
    .asset-card,
    .promo-admin-card {
      padding: 1rem;
    }

    .admin-card-top,
    .promo-admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.9rem;
    }

    .admin-card-ref,
    .promo-admin-header h3 {
      margin: 0;
      font-weight: 700;
      color: var(--luxury-text);
      font-size: 1.08rem;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      padding: 0.28rem 0.58rem;
      font-size: 0.58rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 700;
    }

    .status-new { background: rgba(216,179,106,0.2); color: var(--luxury-gold-soft); }
    .status-pending { background: rgba(96,165,250,0.15); color: #bfdbfe; }
    .status-confirmed { background: rgba(22,163,74,0.18); color: #bbf7d0; }
    .status-cancelled { background: rgba(248,113,113,0.15); color: #fecaca; }

    .admin-card-meta,
    .admin-card-services,
    .admin-note,
    .asset-path,
    .promo-admin-body p {
      color: rgba(255,255,255,0.7);
    }

    .admin-card-services {
      margin-top: 0.4rem;
      font-size: 0.82rem;
    }

    .booking-meta-row {
      display: flex;
      justify-content: space-between;
      gap: 0.75rem;
      margin-top: 0.75rem;
      color: rgba(255,255,255,0.7);
      font-size: 0.75rem;
    }

    .booking-action-row,
    .review-actions,
    .cta-admin-actions,
    .asset-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-top: 0.9rem;
    }

    .action-btn,
    .asset-btn {
      padding: 0.58rem 0.8rem;
      background: rgba(255,255,255,0.04);
      color: var(--luxury-text);
      border: 1px solid rgba(216,179,106,0.2);
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 700;
    }

    .action-btn.approve,
    .asset-btn:not(.danger) {
      background: rgba(216,179,106,0.14);
      border-color: rgba(216,179,106,0.28);
    }

    .action-btn.delete,
    .asset-btn.danger {
      border-color: rgba(248,113,113,0.32);
      color: #fecaca;
    }

    .admin-note {
      background: rgba(216,179,106,0.05);
      border: 1px dashed rgba(216,179,106,0.2);
      border-radius: 16px;
      padding: 1rem;
      color: rgba(255,255,255,0.8);
    }

    .admin-form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
    }

    .admin-field {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      width: 100%;
    }

    .admin-field label {
      color: rgba(255,255,255,0.72);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .admin-field input,
    .admin-field textarea {
      width: 100%;
      min-height: 3rem;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      background: rgba(255,255,255,0.04);
      color: var(--luxury-text);
      padding: 0.8rem 0.9rem;
      resize: vertical;
    }

    .admin-field textarea {
      min-height: 110px;
    }

    .elea-button-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 3rem;
      padding: 0.75rem 1.2rem;
      background: linear-gradient(135deg, #d8b36a, #ae7b2a);
      color: #0f1b19;
      font-weight: 700;
      border: none;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .elea-button-outline {
      padding: 0.7rem 1rem;
      background: transparent;
      color: var(--luxury-text);
      border-color: rgba(255,255,255,0.16);
    }

    .admin-asset-status {
      color: var(--luxury-gold-soft);
      min-height: 1.2rem;
      margin-top: 0.8rem;
      font-size: 0.82rem;
    }

    .promo-admin-card img,
    .asset-card img {
      display: block;
      width: 100%;
      height: 170px;
      object-fit: cover;
      border-radius: 12px 12px 0 0;
      background: rgba(255,255,255,0.04);
    }

    .promo-admin-body {
      margin-top: 0.8rem;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 980px) {
      .admin-shell {
        flex-direction: column;
        width: min(100%, calc(100% - 1rem));
        padding-top: 0.8rem;
      }

      .admin-sidebar {
        width: 100%;
        padding-bottom: 1rem;
      }

      .admin-mobile-logout {
        display: inline-flex;
      }

      .admin-user .admin-logout {
        display: none;
      }

      .admin-header {
        align-items: flex-start;
      }
    }

    @media (max-width: 640px) {
      .admin-main {
        padding: 1rem 0.8rem 1.4rem;
      }

      .admin-toolbar {
        flex-direction: column;
        align-items: stretch;
      }

      .admin-search, .admin-filter {
        width: 100%;
      }

      .admin-stat-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>

  <main class="admin-shell">
    <aside class="admin-sidebar">
      <div class="sidebar-brand">
        <div class="brand-mark">Elea</div>
        <small>Operations</small>
      </div>

      <nav class="admin-nav" aria-label="Admin panels">
        <button data-admin-tab="bookings" class="admin-tab active" type="button">
          <span>Bookings</span>
          <span class="tab-badge">0</span>
        </button>
        <button data-admin-tab="reviews" class="admin-tab" type="button">
          <span>Reviews</span>
          <span class="tab-badge">0</span>
        </button>
        <button data-admin-tab="customers" class="admin-tab" type="button">
          <span>Customers</span>
        </button>
        <button data-admin-tab="assets" class="admin-tab" type="button">
          <span>Assets</span>
        </button>
        <button data-admin-tab="promos" class="admin-tab" type="button">
          <span>Promos</span>
        </button>
        <button data-admin-tab="settings" class="admin-tab" type="button">
          <span>Settings</span>
        </button>
      </nav>

      <div class="admin-user">
        <div id="admin-current-user-email" class="admin-user-email">Not signed in</div>
        <button class="admin-logout" type="button" data-admin-logout>Sign out</button>
      </div>
    </aside>

    <section class="admin-main" aria-live="polite">
      <header class="admin-header">
        <div>
          <p class="admin-kicker">Luxury ops</p>
          <h1>Admin Dashboard</h1>
        </div>
        <button class="admin-mobile-logout" type="button" data-admin-logout>Sign out</button>
      </header>

      <div class="admin-toolbar">
        <div class="admin-search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7"></circle>
            <path d="M20 20L16.65 16.65"></path>
          </svg>
          <input type="search" aria-label="Search admin" placeholder="Search bookings, reviews, customers..." />
        </div>
        <div class="admin-filter">
          <span>View</span>
          <span class="pill">All</span>
        </div>
      </div>

      <div class="admin-content">
        <section data-admin-section="bookings" id="admin-section-bookings" class="admin-section">
          <div id="admin-calendar"></div>
          <div id="admin-bookings-list" class="admin-grid"></div>
        </section>

        <section data-admin-section="reviews" class="admin-section hidden">
          <div id="admin-reviews-list" class="admin-review-grid"></div>
        </section>

        <section data-admin-section="customers" class="admin-section hidden">
          <div id="admin-customers-list" class="admin-grid"></div>
        </section>

        <section data-admin-section="assets" class="admin-section hidden">
          <form id="admin-asset-form" class="admin-card" autocomplete="off">
            <div class="admin-form-grid">
              <div class="admin-field">
                <label for="admin-asset-name">Asset name</label>
                <input id="admin-asset-name" name="assetName" type="text" placeholder="Kitchen image" />
              </div>
              <div class="admin-field">
                <label for="admin-asset-path">Asset path</label>
                <input id="admin-asset-path" name="assetPath" type="text" placeholder="assets/images/kitchen.png" />
              </div>
            </div>
            <div class="admin-form-grid" style="margin-top:1rem;">
              <div class="admin-field">
                <label for="admin-asset-upload">Upload file</label>
                <input id="admin-asset-upload" type="file" accept="image/*" />
              </div>
              <div class="admin-field" style="justify-content:flex-end;">
                <button type="submit" class="elea-button-primary">Add asset</button>
              </div>
            </div>
            <div id="admin-asset-status" class="admin-asset-status" aria-live="polite"></div>
          </form>
          <div id="admin-assets-list" class="admin-assets-grid" style="margin-top:1rem;"></div>
        </section>

        <section data-admin-section="promos" class="admin-section hidden">
          <form id="admin-notification-form" class="admin-card" autocomplete="off">
            <div class="admin-form-grid">
              <div class="admin-field">
                <label for="admin-notify-plan">Send to plan</label>
                <select id="admin-notify-plan" name="notifyPlan">
                  <option value="all-members">All paid members</option>
                  <option value="basic">Basic</option>
                  <option value="premium">Premium</option>
                  <option value="vip">VIP</option>
                </select>
              </div>
              <div class="admin-field">
                <label for="admin-notify-type">Message type</label>
                <select id="admin-notify-type" name="notifyType">
                  <option value="promo">Promo</option>
                  <option value="notification">Notification</option>
                </select>
              </div>
            </div>
            <div class="admin-form-grid" style="margin-top:1rem;">
              <div class="admin-field">
                <label for="admin-notify-title">Title</label>
                <input id="admin-notify-title" name="notifyTitle" type="text" placeholder="Spring cleanup offer" />
              </div>
              <div class="admin-field">
                <label for="admin-notify-link">Link</label>
                <input id="admin-notify-link" name="notifyLink" type="url" placeholder="https://wa.me/4915216019843" />
              </div>
            </div>
            <div class="admin-form-grid" style="margin-top:1rem;">
              <div class="admin-field" style="grid-column:1 / -1;">
                <label for="admin-notify-message">Message</label>
                <textarea id="admin-notify-message" name="notifyMessage" placeholder="Your premium members get priority access to this month’s special cleaning offer."></textarea>
              </div>
            </div>
            <div style="margin-top:1rem; display:flex; justify-content:space-between; align-items:center; gap:1rem; flex-wrap:wrap;">
              <div id="admin-notify-status" class="admin-asset-status" aria-live="polite"></div>
              <button type="submit" class="elea-button-primary">Send message</button>
            </div>
          </form>

          <form id="admin-cta-form" class="admin-card" autocomplete="off" style="margin-top:1rem;">
            <div class="admin-form-grid">
              <div class="admin-field">
                <label for="admin-cta-title">Title</label>
                <input id="admin-cta-title" name="ctaTitle" type="text" placeholder="Seasonal clean" />
              </div>
              <div class="admin-field">
                <label for="admin-cta-link">Link</label>
                <input id="admin-cta-link" name="ctaLink" type="url" placeholder="https://wa.me/4915216019843" />
              </div>
            </div>
            <div class="admin-form-grid" style="margin-top:1rem;">
              <div class="admin-field">
                <label for="admin-cta-image">Image URL</label>
                <input id="admin-cta-image" name="ctaImage" type="url" placeholder="assets/images/kitchen.png" />
              </div>
              <div class="admin-field">
                <label for="admin-cta-text">Message</label>
                <textarea id="admin-cta-text" name="ctaText" placeholder="Premium cleaning packages for your home."></textarea>
              </div>
            </div>
            <div style="margin-top:1rem; display:flex; justify-content:flex-end;">
              <button type="submit" class="elea-button-primary">Create promo</button>
            </div>
          </form>
          <div id="admin-cta-list" class="admin-cta-grid" style="margin-top:1rem;"></div>
        </section>

        <section data-admin-section="settings" class="admin-section hidden">
          <form id="admin-settings-form" class="admin-card" autocomplete="off">
            <div class="admin-form-grid">
              <div class="admin-field">
